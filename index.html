<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Online Bookstore Catalog</h1>
        <p>Browse our collection of programming essentials</p>
    </header>

    <main class="book-grid">
        <!-- Book 1 -->
        <div class="book-card">
            <div>
                <h2 class="book-title">Clean Code</h2>
                <p class="book-author">by Robert C. Martin</p>
            </div>
            <div class="book-footer">
                <span class="book-price">₹499.00</span>
                <span class="badge in-stock">Available</span>
            </div>
        </div>

        <!-- Book 2 -->
        <div class="book-card">
            <div>
                <h2 class="book-title">Effective Java</h2>
                <p class="book-author">by Joshua Bloch</p>
            </div>
            <div class="book-footer">
                <span class="book-price">₹650.00</span>
                <span class="badge in-stock">Available</span>
            </div>
        </div>

        <!-- Book 3 -->
        <div class="book-card">
            <div>
                <h2 class="book-title">The Pragmatic Programmer</h2>
                <p class="book-author">by Andrew Hunt</p>
            </div>
            <div class="book-footer">
                <span class="book-price">₹550.00</span>
                <span class="badge out-of-stock">Out of Stock</span>
            </div>
        </div>

        <!-- Book 4 -->
        <div class="book-card">
            <div>
                <h2 class="book-title">Head First Java</h2>
                <p class="book-author">by Kathy Sierra</p>
            </div>
            <div class="book-footer">
                <span class="book-price">₹420.00</span>
                <span class="badge in-stock">Available</span>
            </div>
        </div>
    </main>

</body>
</html>
